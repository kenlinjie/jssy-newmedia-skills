name: Check skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-resolver:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Check release resolution without installing applications
        run: python -m unittest discover -s tests -v
